name: Feature request
description: Suggest an improvement to an existing component, the engine or the docs.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen instead.
    validations:
      required: true
