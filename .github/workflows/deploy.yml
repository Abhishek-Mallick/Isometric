name: Deploy

# Abhishek-Mallick/Isometric deploys to GitHub Pages on every push to main.
#
# Where it is served is one repository variable
# (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL  = https://isometric.buildlab.in   once the custom domain is set up
#               (unset, it is https://<owner>.github.io/<repo>)
# Set Settings → Pages → Source to "GitHub Actions", and the custom domain
# there too. Forks don't deploy unless they set ENABLE_PAGES = true.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Abhishek-Mallick/Isometric' || vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve site URL
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$CUSTOM_SITE_URL" ]; then
            SITE_URL="$CUSTOM_SITE_URL"
          else
            OWNER="${GITHUB_REPOSITORY_OWNER,,}"
            SITE_URL="https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          SITE_URL="${SITE_URL%/}"
          REST="${SITE_URL#*://}"
          case "$REST" in */*) BASE_PATH="/${REST#*/}" ;; *) BASE_PATH="" ;; esac
          {
            echo "SITE_URL=$SITE_URL"
            echo "BASE_PATH=$BASE_PATH"
            echo "REGISTRY_URL=$SITE_URL/r"
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL"
          } >> "$GITHUB_ENV"
          echo "Deploying to $SITE_URL (base path: '${BASE_PATH:-/}')"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm registry:validate

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
