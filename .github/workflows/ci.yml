name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build registry and site
        run: pnpm build
      - name: Validate registry
        run: pnpm registry:validate
      - name: registry.json is up to date
        run: git diff --exit-code registry.json
      - name: Browser smoke tests
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
